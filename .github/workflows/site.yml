name: site

# Builds and checks boreale.dev (site/README.md) for each pull request and
# for main, and publishes main's on GitHub Pages (Settings › Pages ›
# Source: GitHub Actions). Once a day too, and when a project says it
# released (a repository_dispatch of type "release"), so the versions on the
# cards and the latest releases follow the projects' releases.
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  repository_dispatch:
    types: [ release ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pages
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the projects' releases, without the API's anonymous limit
        run: python3 tools/build_site.py build
      - name: Their links, catalogs and Content-Security-Policy
        run: python3 tools/check_site.py build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
