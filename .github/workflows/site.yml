name: site

# Builds and checks boreale.dev (site/README.md) for each pull request and
# for main, and publishes main's on GitHub Pages (Settings › Pages ›
# Source: GitHub Actions). Once a day too, and when a project says it
# released (a repository_dispatch of type "release"), so the versions on the
# cards and the latest releases follow the projects' releases: those two
# publish only when the site built differs from the one served.
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  repository_dispatch:
    types: [ release ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Playwright, pinned, for the layout check (tools/site_layout.py).
  PLAYWRIGHT_VERSION: 1.64.0
  # axe-core, for the accessibility check: its npm package, checked against
  # the hash it had when pinned (as PlayShelf's web.yml).
  AXE_VERSION: 4.13.0
  AXE_SHA256: 096912f6e77b4b695fc9304b7be65091db42d98de054da674ae222a11cb33f70

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.new.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pages
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the projects' releases, without the API's anonymous limit
          # On main, releases GitHub cannot give fail the build: the site
          # served keeps its versions rather than lose them.
          SITE_STRICT: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: python3 tools/build_site.py build
      - name: Their links, catalogs and Content-Security-Policy
        run: python3 tools/check_site.py build
      # Playwright for Python and its Chromium, kept from one run to the next
      # while PLAYWRIGHT_VERSION stays.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-venv
          key: playwright-ubuntu-26.04-${{ env.PLAYWRIGHT_VERSION }}
      # No page wider than the screen on phones, a tablet or a desktop, no
      # target too small to touch, no script that throws, nothing axe finds
      # against WCAG 2.2 AA (tools/site_layout.py). About a minute.
      - name: The pages on phones, a tablet and a desktop
        timeout-minutes: 8
        run: |
          VENV="$HOME/.cache/playwright-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install -q "playwright==$PLAYWRIGHT_VERSION"
          fi
          sudo "$VENV/bin/python" -m playwright install-deps chromium
          "$VENV/bin/python" -m playwright install chromium
          curl -sfL --retry 3 -o "$RUNNER_TEMP/axe.tgz" "https://registry.npmjs.org/axe-core/-/axe-core-$AXE_VERSION.tgz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tgz" | sha256sum -c --quiet
          python3 -c 'import sys, tarfile; open(sys.argv[2], "wb").write(tarfile.open(sys.argv[1]).extractfile("package/axe.min.js").read())' \
            "$RUNNER_TEMP/axe.tgz" "$RUNNER_TEMP/axe.min.js"
          SITE_AXE="$RUNNER_TEMP/axe.min.js" "$VENV/bin/python" -u tools/site_layout.py build
      # main's site is published, unless a scheduled or dispatched build made
      # exactly the one served (its build.sha256, tools/build_site.py).
      - name: Anything new to publish
        id: new
        if: github.ref == 'refs/heads/main'
        run: |
          served=""
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
            served=$(curl -sfL --retry 3 "https://boreale.dev/build.sha256" || true)
          fi
          if [ -n "$served" ] && [ "$served" = "$(cat build/build.sha256)" ]; then
            echo "The site served is the one built: nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.new.outputs.publish == 'true'
        with:
          path: build

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
