name: site

# Builds and checks boreale.dev (site/README.md) for each pull request and
# for main, and publishes main's on GitHub Pages (Settings › Pages ›
# Source: GitHub Actions). Once a day too, and when a project says it
# released (a repository_dispatch of type "release"), so the versions on the
# cards and the latest releases follow the projects' releases: those two
# publish only when the site built differs from the one served.
#
# The checkout, the build, the checks and the layout check are boreale-site's
# reusable workflow (library/boreale-site's README, "Reusable workflow");
# the deployment is this repository's.
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  repository_dispatch:
    types: [ release ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read   # asked by the reusable workflow (the site's address)
    uses: JigSawFr/boreale-site/.github/workflows/site.yml@49844b1a733f738afdabcc1c903bbf8696028d96 # v1.0.0
    with:
      timeout_minutes: 15
      layout_timeout_minutes: 8
      github_token: true   # the projects' releases, without the API's anonymous limit
      # On main, releases GitHub cannot give fail the build: the site
      # served keeps its versions rather than lose them.
      env: ${{ github.ref == 'refs/heads/main' && '{"SITE_STRICT":"1"}' || '{}' }}
      build: python3 tools/build_site.py build
      check: python3 tools/check_site.py build
      # main's site is published, unless a scheduled or dispatched build made
      # exactly the one served (its build.sha256, tools/build_site.py).
      pages_artifact: ${{ github.ref == 'refs/heads/main' }}
      gate: |
        served=""
        if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
          served=$(curl -sfL --retry 3 "https://boreale.dev/build.sha256" || true)
        fi
        if [ -n "$served" ] && [ "$served" = "$(cat build/build.sha256)" ]; then
          echo "The site served is the one built: nothing to publish."
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi

  deploy:
    needs: build
    if: needs.build.outputs.pages_artifact_id != ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
