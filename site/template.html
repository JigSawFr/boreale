<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#0b1424">
<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="en" href="{{site}}">
<link rel="alternate" hreflang="fr" href="{{site}}fr/">
<link rel="alternate" hreflang="x-default" href="{{site}}">
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
<link rel="preload" href="{{root}}assets/fonts/sora.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/site.css">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Boréale">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{site}}assets/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:locale" content="{{og_locale}}">
<meta name="twitter:card" content="summary_large_image">
<script src="{{root}}assets/site.js" defer></script>
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>
<div class="sky">
  <canvas id="sky" aria-hidden="true"></canvas>
  <header class="wrap top">
    <a class="brand" href="{{root}}{{home}}"><img src="{{root}}assets/marks/boreale.svg" alt="" width="34" height="34">Boréale</a>
    <nav aria-label="{{nav_label}}">
      <ul>
        <li><a href="{{root}}{{home}}#projects">{{nav_projects}}</a></li>
        <li><a href="https://github.com/JigSawFr">GitHub</a></li>
        <li><a href="{{root}}{{other_href}}" lang="{{other_lang}}" hreflang="{{other_lang}}">{{other_label}}</a></li>
      </ul>
    </nav>
  </header>
  {{hero}}
</div>
{{body}}
<footer class="site">
  <div class="wrap row">
    <p>{{footer_made}}</p>
    <p>{{footer_nintendo}}</p>
  </div>
</footer>
</body>
</html>
