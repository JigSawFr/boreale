<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PlayShelf's HOME menu icon (icon.jpg), written by tools/brand.py: the night sky and the aurora's curtain over the whole square, its mark lifted by a shadow, its name in Sora 700. Everywhere else, icon.svg. -->
  <defs>
    <linearGradient id="c-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1430"/><stop offset="0.7" stop-color="#1A3557"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
    <linearGradient id="c-colour" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.6" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="c-rise" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="c-rays" width="9" height="256" patternUnits="userSpaceOnUse"><rect width="9" height="256" fill="#fff" opacity="0.55"/><rect x="2" width="4" height="256" fill="#fff"/></pattern>
    <filter id="c-ray-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6 0"/></filter>
    <mask id="c-curtain" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><g filter="url(#c-ray-blur)"><rect width="256" height="256" fill="url(#c-rays)"/></g></mask>
    <mask id="c-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><path d="M0 128 C 60 88, 110 138, 170 98 S 240 68, 256 78 L 256 0 L 0 0 Z" fill="url(#c-rise)"/></mask>
    <filter id="c-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="c-shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="256" height="256" fill="url(#c-sky)"/>
  <g mask="url(#c-fade)"><rect width="256" height="256" fill="url(#c-colour)" opacity="0.8" mask="url(#c-curtain)"/></g>
  <g mask="url(#c-fade)" filter="url(#c-blur)"><rect width="256" height="256" fill="url(#c-colour)" opacity="0.35"/></g>
  <circle cx="40" cy="30" r="1.5" fill="#E8EEF7"/><circle cx="214" cy="146" r="1.2" fill="#E8EEF7" opacity="0.7"/><circle cx="30" cy="160" r="1" fill="#E8EEF7" opacity="0.5"/>
  <g filter="url(#c-shadow)" transform="translate(128 102) scale(0.62) translate(-128 -130)"><defs><linearGradient id="c-m-colour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.65" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient></defs>
  <path d="M58 40 L 198 40 Q 214 40 214 56 L 214 200 Q 214 216 198 216 L 58 216 Q 42 216 42 200 L 42 56 Q 42 40 58 40 Z" fill="#0E1A33" stroke="url(#c-m-colour)" stroke-width="16" stroke-linejoin="round"/>
  <path d="M68 112 L 188 112 M68 176 L 188 176" stroke="url(#c-m-colour)" stroke-width="14" stroke-linecap="round"/><path d="M76 98 L 76 72 M100 98 L 100 82 M150 98 L 150 68 M86 162 L 86 132 M134 162 L 134 140 M160 162 L 160 130" stroke="#E8EEF7" stroke-width="16" stroke-linecap="round"/></g>
  <text x="128" y="224" text-anchor="middle" font-family="Sora" font-weight="700" font-size="34" letter-spacing="-0.8" fill="#E8EEF7">PlayShelf</text>
</svg>
