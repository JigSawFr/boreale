<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PlayGuard's icon, written by tools/brand.py: its mark's frame in the aurora's colours around a night sky, the aurora, its drawing in snow. Full-bleed: the consoles, the stores and the phones round its corners; <image href="icon.svg"> elsewhere rounds them itself. -->
  <defs>
    <linearGradient id="i-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1020"/><stop offset="1" stop-color="#16203A"/></linearGradient>
    <linearGradient id="i-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1430"/><stop offset="1" stop-color="#132A44"/></linearGradient>
    <linearGradient id="i-colour" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.6" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="i-frame-colour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.65" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="i-rise" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="i-rays" width="9" height="256" patternUnits="userSpaceOnUse"><rect width="9" height="256" fill="#fff" opacity="0.55"/><rect x="2" width="4" height="256" fill="#fff"/></pattern>
    <filter id="i-ray-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6 0"/></filter>
    <mask id="i-curtain-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><g filter="url(#i-ray-blur)"><rect width="256" height="256" fill="url(#i-rays)"/></g></mask>
    <filter id="i-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="i-line-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="i-frame"><path d="M128 42 C 154 54, 180 60, 204 60 L 204 126 C 204 172, 174 200, 128 218 C 82 200, 52 172, 52 126 L 52 60 C 76 60, 102 54, 128 42 Z"/></clipPath>
    <mask id="i-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><path d="M44 134 C 80 104, 108 144, 146 116 S 196 90, 214 100 L 230 20 L 26 20 Z" fill="url(#i-rise)"/></mask>
  </defs>
  <rect width="256" height="256" fill="url(#i-night)"/>
  <g clip-path="url(#i-frame)">
    <rect width="256" height="256" fill="url(#i-sky)"/>
    <circle cx="80" cy="72" r="1.8" fill="#E8EEF7"/><circle cx="178" cy="70" r="1.5" fill="#E8EEF7" opacity="0.8"/>
    <circle cx="128" cy="62" r="1.2" fill="#E8EEF7" opacity="0.6"/><circle cx="156" cy="84" r="1" fill="#E8EEF7" opacity="0.5"/>
    <g mask="url(#i-fade)"><rect x="20" y="20" width="216" height="200" fill="url(#i-colour)" mask="url(#i-curtain-mask)"/></g>
    <path d="M44 134 C 80 104, 108 144, 146 116 S 196 90, 214 100" fill="none" stroke="url(#i-colour)" stroke-width="6" filter="url(#i-line-glow)"/>
    <path d="M44 134 C 80 104, 108 144, 146 116 S 196 90, 214 100" fill="none" stroke="url(#i-colour)" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 230 L 20 192 L 66 166 L 90 182 L 124 156 L 164 188 L 188 174 L 236 202 L 236 230 Z" fill="#0A1020"/><path d="M66 166 L 76 172 L 70 176 Z M124 156 L 136 166 L 126 168 Z" fill="#1F3355"/><g filter="url(#i-soft)" opacity="0.5"><path d="M107.84 102 L 154.88 130 L 107.84 158 Z" fill="#E8EEF7" stroke="#E8EEF7" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/></g><path d="M107.84 102 L 154.88 130 L 107.84 158 Z" fill="#E8EEF7" stroke="#E8EEF7" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <path d="M128 42 C 154 54, 180 60, 204 60 L 204 126 C 204 172, 174 200, 128 218 C 82 200, 52 172, 52 126 L 52 60 C 76 60, 102 54, 128 42 Z" fill="none" stroke="url(#i-frame-colour)" stroke-width="10" stroke-linejoin="round" filter="url(#i-glow)" opacity="0.6"/>
  <path d="M128 42 C 154 54, 180 60, 204 60 L 204 126 C 204 172, 174 200, 128 218 C 82 200, 52 172, 52 126 L 52 60 C 76 60, 102 54, 128 42 Z" fill="none" stroke="url(#i-frame-colour)" stroke-width="8" stroke-linejoin="round"/>
</svg>
