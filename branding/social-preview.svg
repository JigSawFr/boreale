  <rect width="1280" height="640" fill="#0B1424"/>
  <g fill="#E8EEF7">
    <circle cx="96" cy="70" r="1.6" opacity="0.7"/><circle cx="240" cy="132" r="1.2" opacity="0.5"/><circle cx="410" cy="54" r="1.8" opacity="0.8"/><circle cx="560" cy="110" r="1.1" opacity="0.5"/><circle cx="702" cy="40" r="1.5" opacity="0.7"/><circle cx="860" cy="96" r="1.2" opacity="0.6"/><circle cx="1010" cy="60" r="1.9" opacity="0.8"/><circle cx="1150" cy="128" r="1.3" opacity="0.6"/><circle cx="1220" cy="44" r="1.1" opacity="0.5"/><circle cx="330" cy="200" r="1" opacity="0.4"/><circle cx="960" cy="200" r="1.2" opacity="0.5"/>
