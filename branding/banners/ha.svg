<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <!-- Boréale for HA's README banner, written by tools/make_banners.py: the night, the aurora, its mark, its name, what it does, and Boréale's mark and name in a pill. Sora. -->
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.55" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00FFCC" stop-opacity="0"/><stop offset="1" stop-color="#00FFCC" stop-opacity="0.3"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33BBFF" stop-opacity="0"/><stop offset="1" stop-color="#33BBFF" stop-opacity="0.22"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A5CFF" stop-opacity="0"/><stop offset="1" stop-color="#8A5CFF" stop-opacity="0.24"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1280" height="320" rx="24" fill="#0B1424"/>
  <g filter="url(#soft)">
    <path d="M0 170 C 220 110, 420 190, 640 130 S 1040 80, 1280 120 L 1280 10 C 1040 -10, 860 60, 640 30 S 220 0, 0 60 Z" fill="url(#c1)"/>
    <path d="M0 130 C 260 90, 480 150, 700 110 S 1080 60, 1280 90 L 1280 0 L 0 0 Z" fill="url(#c2)"/>
    <path d="M0 100 C 300 60, 520 120, 760 80 S 1100 40, 1280 60 L 1280 0 L 0 0 Z" fill="url(#c3)"/>
  </g>
  <g fill="#E8EEF7"><circle cx="80" cy="40" r="1.4" opacity="0.7"/><circle cx="300" cy="28" r="1.2" opacity="0.5"/><circle cx="520" cy="54" r="1.6" opacity="0.7"/><circle cx="760" cy="22" r="1.1" opacity="0.5"/><circle cx="980" cy="48" r="1.5" opacity="0.7"/><circle cx="1180" cy="30" r="1.2" opacity="0.6"/></g>
  <svg x="72" y="76" width="168" height="168" viewBox="0 0 256 256"><clipPath id="m-round"><rect width="256" height="256" rx="56"/></clipPath><g clip-path="url(#m-round)"><defs>
    <linearGradient id="m-i-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1020"/><stop offset="1" stop-color="#16203A"/></linearGradient>
    <linearGradient id="m-i-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1430"/><stop offset="1" stop-color="#132A44"/></linearGradient>
    <linearGradient id="m-i-colour" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.6" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="m-i-frame-colour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.65" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="m-i-rise" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="m-i-rays" width="9" height="256" patternUnits="userSpaceOnUse"><rect width="9" height="256" fill="#fff" opacity="0.55"/><rect x="2" width="4" height="256" fill="#fff"/></pattern>
    <filter id="m-i-ray-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6 0"/></filter>
    <mask id="m-i-curtain-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><g filter="url(#m-i-ray-blur)"><rect width="256" height="256" fill="url(#m-i-rays)"/></g></mask>
    <filter id="m-i-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="m-i-line-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="m-i-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="m-i-frame"><path d="M128 46 L 212 114 L 212 202 Q 212 212 202 212 L 54 212 Q 44 212 44 202 L 44 114 Z"/></clipPath>
