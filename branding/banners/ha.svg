    <path d="M36 150 C 76 120, 106 160, 146 132 S 196 106, 220 116" fill="none" stroke="url(#m-i-colour)" stroke-width="6" filter="url(#m-i-line-glow)"/>
    <path d="M36 150 C 76 120, 106 160, 146 132 S 196 106, 220 116" fill="none" stroke="url(#m-i-colour)" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 230 L 20 192 L 66 166 L 90 182 L 124 156 L 164 188 L 188 174 L 236 202 L 236 230 Z" fill="#0A1020"/>
    <path d="M66 166 L 76 172 L 70 176 Z M124 156 L 136 166 L 126 168 Z" fill="#1F3355"/>
    <path d="M110 127 L 152 152 L 110 177 Z" fill="#E8EEF7" stroke="#E8EEF7" stroke-width="8" stroke-linejoin="round" filter="url(#m-i-soft)" opacity="0.5"/>
    <path d="M110 127 L 152 152 L 110 177 Z" fill="#E8EEF7" stroke="#E8EEF7" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <path d="M128 46 L 212 114 L 212 202 Q 212 212 202 212 L 54 212 Q 44 212 44 202 L 44 114 Z" fill="none" stroke="url(#m-i-frame-colour)" stroke-width="10" stroke-linejoin="round" filter="url(#m-i-glow)" opacity="0.6"/>
  <path d="M128 46 L 212 114 L 212 202 Q 212 212 202 212 L 54 212 Q 44 212 44 202 L 44 114 Z" fill="none" stroke="url(#m-i-frame-colour)" stroke-width="8" stroke-linejoin="round"/></g></svg>
  <text x="276" y="172" font-family="Sora" font-weight="700" font-size="76" letter-spacing="-2.5" fill="#E8EEF7">Boréale for HA</text>
  <rect x="280" y="192" width="72" height="5" rx="2.5" fill="url(#word)"/>
  <text x="278" y="236" font-family="Sora" font-weight="300" font-size="28" fill="#E8EEF7">Your Switch homebrews, at home</text>
  <rect x="1060" y="28" width="192" height="52" rx="26" fill="#0E1A33" stroke="#22324F" stroke-width="2"/>
  <svg x="1072" y="36" width="36" height="36" viewBox="0 0 256 256"><defs><linearGradient id="b-colour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.65" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient><clipPath id="b-sky"><circle cx="128" cy="128" r="84"/></clipPath></defs>
  <circle cx="128" cy="128" r="92" fill="#0E1A33" stroke="url(#b-colour)" stroke-width="16"/>
  <path clip-path="url(#b-sky)" d="M36 156 C 76 116, 108 172, 140 132 S 196 104, 224 126" fill="none" stroke="url(#b-colour)" stroke-width="12" stroke-linecap="round"/>
  <path d="M128 52 C 132 78, 138 84, 160 88 C 138 92, 132 98, 128 124 C 124 98, 118 92, 96 88 C 118 84, 124 78, 128 52 Z" fill="#E8EEF7"/></svg>
  <text x="1118" y="62" font-family="Sora" font-weight="400" font-size="20" fill="#A9B6CC">by <tspan font-weight="700" fill="#E8EEF7">Boréale</tspan></text>
</svg>
