<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Aurore's social preview (1280 × 640: GitHub's Settings › General, the site's og:image), written by tools/brand.py: the aurora's curtain over the night, the icon, the name, what it does, what it has, and Boréale's pill. Sora. -->
  <defs>
    <linearGradient id="s-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1020"/><stop offset="1" stop-color="#141B2E"/></linearGradient>
    <linearGradient id="s-word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.55" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="s-colour" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FFCC" stop-opacity="0"/><stop offset="0.25" stop-color="#00FFCC"/><stop offset="0.65" stop-color="#33BBFF"/><stop offset="0.9" stop-color="#8A5CFF"/><stop offset="1" stop-color="#8A5CFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="s-rise" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="s-rays" width="14" height="640" patternUnits="userSpaceOnUse"><rect width="14" height="640" fill="#fff" opacity="0.5"/><rect x="3.5" width="6.3" height="640" fill="#fff"/></pattern>
    <filter id="s-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4.2 2"/></filter>
    <filter id="s-line" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <mask id="s-rays-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640"><rect width="1280" height="640" fill="url(#s-rays)" filter="url(#s-soft)"/></mask>
    <mask id="s-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="640"><path d="M0 330 C 220 220, 440 360, 700 270 S 1100 180, 1280 230 L 1280 0 L 0 0 Z" fill="url(#s-rise)"/></mask>
    <clipPath id="s-tile"><rect x="560" y="110" width="160" height="160" rx="36"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#s-sky)"/>
  <g opacity="0.55">
    <g mask="url(#s-fade)"><rect width="1280" height="640" fill="url(#s-colour)" mask="url(#s-rays-mask)"/></g>
    <path d="M0 330 C 220 220, 440 360, 700 270 S 1100 180, 1280 230" fill="none" stroke="url(#s-colour)" stroke-width="10" filter="url(#s-line)"/>
    <path d="M0 330 C 220 220, 440 360, 700 270 S 1100 180, 1280 230" fill="none" stroke="url(#s-colour)" stroke-width="2.5" opacity="0.8"/>
  </g>
  <g fill="#E8EEF7">
    <circle cx="140" cy="60" r="1.6" opacity="0.7"/><circle cx="1130" cy="70" r="1.4" opacity="0.8"/>
    <circle cx="1200" cy="520" r="1.2" opacity="0.6"/><circle cx="90" cy="560" r="1.2" opacity="0.5"/>
    <circle cx="640" cy="40" r="1.3" opacity="0.6"/><circle cx="980" cy="600" r="1" opacity="0.5"/>
  </g>
  <g clip-path="url(#s-tile)"><svg x="560" y="110" width="160" height="160" viewBox="0 0 256 256"><defs>
    <linearGradient id="i-i-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1020"/><stop offset="1" stop-color="#16203A"/></linearGradient>
    <linearGradient id="i-i-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1430"/><stop offset="1" stop-color="#132A44"/></linearGradient>
    <linearGradient id="i-i-colour" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.6" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="i-i-frame-colour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.65" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
    <linearGradient id="i-i-rise" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.25" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="i-i-rays" width="9" height="256" patternUnits="userSpaceOnUse"><rect width="9" height="256" fill="#fff" opacity="0.55"/><rect x="2" width="4" height="256" fill="#fff"/></pattern>
    <filter id="i-i-ray-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6 0"/></filter>
    <mask id="i-i-curtain-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><g filter="url(#i-i-ray-blur)"><rect width="256" height="256" fill="url(#i-i-rays)"/></g></mask>
    <filter id="i-i-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="i-i-line-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i-i-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="i-i-frame"><path d="M58 40 L 198 40 Q 214 40 214 56 L 214 200 Q 214 216 198 216 L 58 216 Q 42 216 42 200 L 42 56 Q 42 40 58 40 Z"/></clipPath>
    <mask id="i-i-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><path d="M44 134 C 80 104, 108 144, 146 116 S 196 90, 214 100 L 230 20 L 26 20 Z" fill="url(#i-i-rise)"/></mask>
  </defs>
  <rect width="256" height="256" fill="url(#i-i-night)"/>
  <g clip-path="url(#i-i-frame)">
    <rect width="256" height="256" fill="url(#i-i-sky)"/>
    <circle cx="80" cy="72" r="1.8" fill="#E8EEF7"/><circle cx="178" cy="70" r="1.5" fill="#E8EEF7" opacity="0.8"/>
    <circle cx="128" cy="62" r="1.2" fill="#E8EEF7" opacity="0.6"/><circle cx="156" cy="84" r="1" fill="#E8EEF7" opacity="0.5"/>
    <g mask="url(#i-i-fade)"><rect x="20" y="20" width="216" height="200" fill="url(#i-i-colour)" mask="url(#i-i-curtain-mask)"/></g>
    <path d="M44 134 C 80 104, 108 144, 146 116 S 196 90, 214 100" fill="none" stroke="url(#i-i-colour)" stroke-width="6" filter="url(#i-i-line-glow)"/>
    <path d="M44 134 C 80 104, 108 144, 146 116 S 196 90, 214 100" fill="none" stroke="url(#i-i-colour)" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 230 L 20 192 L 66 166 L 90 182 L 124 156 L 164 188 L 188 174 L 236 202 L 236 230 Z" fill="#0A1020"/><path d="M66 166 L 76 172 L 70 176 Z M124 156 L 136 166 L 126 168 Z" fill="#1F3355"/>
  </g>
  <path d="M58 40 L 198 40 Q 214 40 214 56 L 214 200 Q 214 216 198 216 L 58 216 Q 42 216 42 200 L 42 56 Q 42 40 58 40 Z" fill="none" stroke="url(#i-i-frame-colour)" stroke-width="10" stroke-linejoin="round" filter="url(#i-i-glow)" opacity="0.6"/>
  <path d="M58 40 L 198 40 Q 214 40 214 56 L 214 200 Q 214 216 198 216 L 58 216 Q 42 216 42 200 L 42 56 Q 42 40 58 40 Z" fill="none" stroke="url(#i-i-frame-colour)" stroke-width="8" stroke-linejoin="round"/></svg></g>
  <text x="640" y="400" text-anchor="middle" font-family="Sora" font-weight="700" font-size="104" letter-spacing="-2.5" fill="#E8EEF7">Aurore</text>
  <rect x="580" y="424" width="120" height="5" rx="2.5" fill="url(#s-word)"/>
  <text x="640" y="484" text-anchor="middle" font-family="Sora" font-size="30" fill="#A9B6CC">A Switch-like interface for your app, on every screen</text>
  <text x="640" y="548" text-anchor="middle" font-family="Sora" font-size="22" fill="#6F7E99">Android · iOS · Windows · macOS · Linux · PS4 · PS Vita · Nintendo Switch · New 3DS</text>
  <g transform="translate(1048 572)"><rect width="192" height="52" rx="26" fill="#0E1A33" stroke="#22324F" stroke-width="2"/><svg x="12" y="8" width="36" height="36" viewBox="0 0 256 256"><defs><linearGradient id="b-colour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.65" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient><clipPath id="b-sky"><circle cx="128" cy="128" r="84"/></clipPath></defs>
  <circle cx="128" cy="128" r="92" fill="#0E1A33" stroke="url(#b-colour)" stroke-width="16"/>
  <path clip-path="url(#b-sky)" d="M36 156 C 76 116, 108 172, 140 132 S 196 104, 224 126" fill="none" stroke="url(#b-colour)" stroke-width="12" stroke-linecap="round"/>
  <path d="M128 52 C 132 78, 138 84, 160 88 C 138 92, 132 98, 128 124 C 124 98, 118 92, 96 88 C 118 84, 124 78, 128 52 Z" fill="#E8EEF7"/></svg><text x="58" y="34" font-family="Sora" font-weight="400" font-size="20" fill="#A9B6CC">by <tspan font-weight="700" fill="#E8EEF7">Boréale</tspan></text></g>
</svg>
