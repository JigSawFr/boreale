    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6"><stop offset="0" stop-color="#1A3A5C" stop-opacity="0.9"/><stop offset="1" stop-color="#0B1424" stop-opacity="0"/></radialGradient></defs>
  <rect width="512" height="512" rx="112" fill="#0B1424"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
