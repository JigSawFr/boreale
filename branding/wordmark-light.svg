<svg xmlns="http://www.w3.org/2000/svg" width="720" height="176" viewBox="0 0 360 88">
  <!-- The "Boréale" wordmark in the night's blue, for light grounds, underlined by the aurora's colours, as PlayGuard's and PlayShelf's are. Sora 700. -->
  <defs><linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00FFCC"/><stop offset="0.55" stop-color="#33BBFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient></defs>
  <text x="180" y="56" text-anchor="middle" font-family="Sora" font-weight="700" font-size="60" letter-spacing="-1.8" fill="#0E1A33">Boréale</text>
  <rect x="150" y="80" width="60" height="4" rx="2" fill="url(#word)"/>
</svg>
